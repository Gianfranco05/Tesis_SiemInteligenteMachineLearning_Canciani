# logstash.conf — Pipeline de procesamiento de logs
# SIEM Inteligente | UTN FRM | Gianfranco Canciani
#
# CAMBIO CLAVE (versión anterior): routing condicional por tipo de log,
# cada RU tiene su propio bloque de parsing, catch-all sin drop.
#
# CAMBIO NUEVO (esta corrección): se agrega el campo top-level
# "hora_evento", extraído por regex directamente del TEXTO del mensaje
# (formato "HH:MM:SS"), para TODOS los eventos, no solo para el motor ML.
# Esto es necesario porque el workflow n8n de RU-2 (accesos nocturnos)
# usaba @timestamp (hora de INGESTA) para decidir si un acceso era
# nocturno, lo cual es incorrecto: @timestamp es el momento en que
# Logstash procesó el log, no el momento real del evento simulado.
# motor_ml.py ya hacía esta extracción por su cuenta (Anexo J.4 de la
# tesis); ahora la hace Logstash una sola vez y la deja disponible como
# campo indexado para que la use tanto n8n como Kibana/Grafana.

input {
  tcp {
    port => 5044
    codec => plain { charset => "UTF-8" }
  }
}

filter {

  # ──────────────────────────────────────────────────────────────
  # RU-1: Fuerza Bruta SSH — "Failed password for X from IP"
  # ──────────────────────────────────────────────────────────────
  if [message] =~ "Failed password" {
    grok {
      # NUEVO: se agregó un segundo patrón para aceptar el log NATIVO
      # de sshd tal como lo emite el contenedor victima_ssh vía s6-log
      # (timestamp ISO de alta precisión, sin hostname ni "sshd[pid]:",
      # y con el prefijo opcional "invalid user" cuando el usuario no
      # existe). El primer patrón se mantiene para el simulador
      # (simulador_ataques.py), que sigue generando el formato syslog
      # clásico. Grok prueba los patrones en orden y usa el primero
      # que matchee.
      match => {
        "message" => [
          "%{SYSLOGTIMESTAMP:timestamp_raw} %{DATA:hostname} sshd\[%{POSINT:pid}\]: %{DATA:ssh_status} password for %{DATA:user} from %{IP:source_ip} port %{POSINT:port}",
          "%{TIMESTAMP_ISO8601:timestamp_raw}\s+%{DATA:ssh_status} password for (?:invalid user )?%{DATA:user} from %{IP:source_ip} port %{POSINT:port}"
        ]
      }
    }
    mutate {
      add_field => {
        "[event][category]" => "authentication"
        "[event][type]"     => "start"
        "[rule][name]"      => "RU-1"
        "[rule][description]" => "Intento fallido de autenticacion SSH"
      }
    }
  }

  # ──────────────────────────────────────────────────────────────
  # RU-2: Acceso Exitoso (potencialmente anómalo por horario)
  # "Accepted password for X from IP"
  # ──────────────────────────────────────────────────────────────
  else if [message] =~ "Accepted password" or [message] =~ "EXITOSO" {
    grok {
      match => {
        "message" => "%{SYSLOGTIMESTAMP:timestamp_raw} %{DATA:hostname} sshd\[%{POSINT:pid}\]: %{DATA:ssh_status} password for %{DATA:user} from %{IP:source_ip} port %{POSINT:port}"      }
    }
    mutate {
      add_field => {
        "[event][category]" => "authentication"
        "[event][type]"     => "end"
        "[rule][name]"      => "RU-2"
        "[rule][description]" => "Acceso exitoso SSH - evaluar horario"
      }
    }
  }

  # ──────────────────────────────────────────────────────────────
  # RU-3: Pico de CPU / Recursos — "SPIKE_CPU detectado"
  # ──────────────────────────────────────────────────────────────
 else if [message] =~ "SPIKE_CPU" {
    grok {
      match => {
        "message" => "%{SYSLOGTIMESTAMP:timestamp_raw} %{DATA:hostname} systemd\[%{POSINT:pid}\]: METRICA ANOMALA: SPIKE_CPU detectado al %{NUMBER:cpu_usage}% \(Desviacion > 3 sigma\) en host %{IP:source_ip}"
      }
    }
    mutate {
      add_field => {
        "[event][category]" => "process"
        "[event][type]"     => "info"
        "[rule][name]"      => "RU-3"
        "[rule][description]" => "Pico de consumo de CPU detectado"
      }
      convert => { "cpu_usage" => "float" }
    }
  }

  # ──────────────────────────────────────────────────────────────
  # T1040: Modo Promiscuo de Red (Network Sniffing)
  # ──────────────────────────────────────────────────────────────
  else if [message] =~ "promiscuous" or [message] =~ "promisc" {
    mutate {
      add_field => {
        "[event][category]" => "network"
        "[event][type]"     => "change"
        "[rule][name]"      => "T1040"
        "[rule][description]" => "Interfaz de red en modo promiscuo detectada"
      }
    }
  }

  # ──────────────────────────────────────────────────────────────
  # T1071: Beaconing C2 — patrones de User-Agent anómalos
  # ──────────────────────────────────────────────────────────────
  else if [message] =~ "beaconing" or [message] =~ "C2" {
    mutate {
      add_field => {
        "[event][category]" => "network"
        "[event][type]"     => "connection"
        "[rule][name]"      => "T1071"
        "[rule][description]" => "Posible canal Command and Control detectado"
      }
    }
  }

  # ──────────────────────────────────────────────────────────────
  # CATCH-ALL: cualquier otro log se indexa como "unknown"
  # NO lo descartamos — podría ser relevante para el ML
  # ──────────────────────────────────────────────────────────────
  else {
    mutate {
      add_field => {
        "[event][category]" => "unknown"
        "[rule][name]"      => "CATCH-ALL"
      }
    }
  }

  # ──────────────────────────────────────────────────────────────
  # NUEVO — hora_evento: hora REAL del evento (extraída del texto del
  # mensaje), independiente de la hora de ingesta de Elasticsearch.
  # Aplica a TODOS los eventos, sin importar la rama de arriba.
  # Formato esperado en el mensaje: "... HH:MM:SS ..." (syslog estándar).
  # Si no se encuentra el patrón, hora_evento queda null (no se inventa
  # un valor con la hora de ingesta, para no reintroducir el mismo bug).
  # ──────────────────────────────────────────────────────────────
  ruby {
    code => '
      texto = event.get("message").to_s
      m = texto.match(/\b([01]?[0-9]|2[0-3]):([0-5][0-9]):([0-5][0-9])\b/)
      if m
        event.set("hora_evento", m[1].to_i)
      else
        event.set("hora_evento", nil)
      end
    '
  }

  # ──────────────────────────────────────────────────────────────
  # NORMALIZACIÓN ECS (aplica a todos los eventos)
  # ──────────────────────────────────────────────────────────────
  mutate {
    # Timestamp de ingesta siempre presente
    add_field => { "ingesta_timestamp" => "%{@timestamp}" }
  }

  # Si el Grok falló (solo en bloques que lo usan), marcamos pero NO descartamos
  if "_grokparsefailure" in [tags] {
    mutate {
      add_field => { "parse_error" => "true" }
      remove_tag => ["_grokparsefailure"]
    }
  }
}

output {
  # Todos los logs van a Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "eventos-seguridad-%{+YYYY.MM.dd}"
  }

  # Solo mostrar en consola si hay parse_error o en modo debug
  # (comentar la línea de abajo en producción para no saturar la terminal)
  stdout { codec => rubydebug }
}
