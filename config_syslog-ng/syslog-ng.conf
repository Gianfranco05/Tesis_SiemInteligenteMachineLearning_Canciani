#############################################################################
# syslog-ng.conf — Recolector de eventos de red (NIVEL 2)
# SIEM Inteligente | UTN FRM | Gianfranco Canciani
#
# PROPÓSITO
#   Recibir syslog ORGÁNICO de máquinas reales de la red (routers, hosts
#   Linux con rsyslog, etc.) y reenviarlo a Logstash (logstash:5044) para
#   que sea parseado por el mismo pipeline que el tráfico SSH del Nivel 1.
#   Objetivo experimental: confirmar que eventos reales NO disparan falsos
#   positivos de RU-1/RU-2/RU-3 (deben caer en CATCH-ALL sin dropear).
#
# PUERTOS
#   syslog-ng corre como usuario NO privilegiado (abc) dentro del
#   contenedor linuxserver, por lo que NO puede bindear puertos < 1024.
#   Por eso escucha internamente en 5514/udp y 6601/tcp. El docker-compose
#   mapea los puertos estándar externos 514/udp y 601/tcp hacia estos:
#       "514:5514/udp"   y   "601:6601/tcp"
#   De cara a la red, los equipos siguen apuntando a 514/udp o 601/tcp.
#
# FORMATO DE REENVÍO
#   El template reconstruye una línea syslog clásica
#   ("$ISODATE $HOST programa[pid]: mensaje") que:
#     - es la que espera el PRIMER patrón grok de RU-1 (hostname + pid),
#     - contiene HH:MM:SS embebido en $ISODATE, de donde Logstash extrae
#       el campo top-level "hora_evento" usado por RU-2 y Kibana/Grafana.
#############################################################################

@version: 4.2
@include "scl.conf"

# ── FUENTES ────────────────────────────────────────────────────────────
# Logs internos del propio syslog-ng (útil para diagnóstico).
source s_local {
  internal();
};

# Recepción de red. network() parsea RFC3164 (BSD, el más común en equipos
# reales que envían a 514/udp) y también acepta RFC5424 sobre estos puertos.
# keep-hostname(yes): conserva el HOSTNAME que la máquina emisora pone en el
# propio mensaje syslog, en vez de sobrescribirlo con la IP del emisor. Así
# en Kibana/ES se ve el host real (workstation01, router-borde, ...) y no el
# gateway Docker. Adecuado para un laboratorio de tesis con equipos confiables.
source s_net {
  network(transport(udp) port(5514) keep-hostname(yes));
  network(transport(tcp) port(6601) keep-hostname(yes));
};

# ── DESTINOS ───────────────────────────────────────────────────────────
# Reenvío principal hacia Logstash: TCP plano, una línea por evento
# (el "\n" del template delimita cada evento para el input tcp de Logstash).
destination d_logstash {
  network(
    "logstash"
    transport(tcp)
    port(5044)
    template("$ISODATE $HOST $MSGHDR$MSG\n")
  );
};

# Copia local en archivo — solo para depuración dentro del contenedor.
# Se escribe en /config/log (escribible por el usuario no-root del contenedor).
destination d_local {
  file("/config/log/messages-net.log");
};

# ── RUTAS DE LOG ───────────────────────────────────────────────────────
# Todo lo recibido por red se reenvía a Logstash.
log {
  source(s_net);
  destination(d_logstash);
};

# Copia local de todo (red + interno) para inspección/troubleshooting.
log {
  source(s_local);
  source(s_net);
  destination(d_local);
};
